spring.application.name=course-learning-module

# MongoDB connection - update credentials/host for your environment
spring.data.mongodb.uri=mongodb://localhost:27017/course_learning_module

server.port=8080

# Allow the React dev server to call the API
cors.allowed-origins=http://localhost:3000

# Mastery threshold used across the module (as a fraction, 0.8 = 80%)
app.mastery-threshold=0.8
