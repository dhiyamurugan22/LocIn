spring.application.name=ai-chat-assistant

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/aichatdb}

# AI Provider: gemini or openai
ai.provider=${AI_PROVIDER:gemini}

# Gemini
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=gemini-1.5-flash
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

# OpenAI
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=gpt-4o-mini
ai.openai.base-url=https://api.openai.com/v1/chat/completions

server.port=8080
